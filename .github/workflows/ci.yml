name: ci
on:
  push:
  pull_request:

env:
  # Hermes commit we test against (v0.22.7). Bump together with requires_hermes in plugin.yaml.
  HERMES_REF: b200f5bc60e31588ba2cb60e288029c4a54ba5fa

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_REF }}
          path: hermes-agent
      - uses: astral-sh/setup-uv@v6
      - name: Install Hermes from its lockfile (as Hermes does)
        run: |
          cd hermes-agent
          uv sync --frozen --python 3.14
          uv pip install --python .venv/bin/python "pytest>=8,<9"
          echo "$GITHUB_WORKSPACE/hermes-agent/.venv/bin" >> "$GITHUB_PATH"
      - name: Unit tests
        run: python -m pytest tests -q -p no:cacheprovider --ignore=tests/integration
      - name: Integration tests (real Hermes loader)
        run: python scripts/run_integration.py "$GITHUB_WORKSPACE/hermes-agent" -q
      - name: Catalog validation
        run: hermes plugins validate --install-deps .
      - name: Plugin doctor
        run: hermes plugins doctor . --ci
