name: ci
on:
  push:
  pull_request:

env:
  # Hermes commit we test against (v0.22.7). Bump together with requires_hermes in plugin.yaml.
  HERMES_REF: b200f5bc60e31588ba2cb60e288029c4a54ba5fa

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_REF }}
          path: hermes-agent
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Hermes and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./hermes-agent "pytest>=8,<9"
      - name: Unit tests
        run: python -m pytest tests -q -p no:cacheprovider
      - name: Integration tests (real Hermes loader)
        run: python scripts/run_integration.py "$GITHUB_WORKSPACE/hermes-agent" -q
      - name: Catalog validation
        run: hermes plugins validate --install-deps .
      - name: Plugin doctor
        run: hermes plugins doctor . --ci
