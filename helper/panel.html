<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Hermes Recorder</title>
<style>
  :root {
    --fg: rgba(255,255,255,.92); --fg2: rgba(255,255,255,.60); --fg3: rgba(255,255,255,.38);
    --line: rgba(255,255,255,.09); --chip: rgba(255,255,255,.08); --chip-h: rgba(255,255,255,.14);
    --rec: #ff453a; --paused: #ffd60a; --card: rgba(255,255,255,.07); --input: rgba(0,0,0,.28);
    --accent: rgba(64,156,255,.65);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --fg: rgba(0,0,0,.86); --fg2: rgba(0,0,0,.55); --fg3: rgba(0,0,0,.35);
      --line: rgba(0,0,0,.08); --chip: rgba(0,0,0,.05); --chip-h: rgba(0,0,0,.10);
      --card: rgba(255,255,255,.65); --input: rgba(255,255,255,.7);
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: transparent; color: var(--fg);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; cursor: default; overflow: hidden; }
  body { display: flex; flex-direction: column; }

  header { display: flex; align-items: center; gap: 8px; padding: 12px 14px 10px; -webkit-app-region: drag; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--fg3); flex: none; }
  body.running .dot { background: var(--rec); animation: pulse 1.8s infinite; }
  body.paused .dot { background: var(--paused); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,69,58,.55); } 70% { box-shadow: 0 0 0 7px rgba(255,69,58,0); } 100% { box-shadow: 0 0 0 0 rgba(255,69,58,0); } }
  .title { font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }
  .apps { color: var(--fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .clock { margin-left: auto; color: var(--fg2); font-variant-numeric: tabular-nums; }
  .x { -webkit-app-region: no-drag; border: 0; background: transparent; color: var(--fg3); font-size: 15px;
    width: 22px; height: 22px; border-radius: 6px; line-height: 22px; }
  .x:hover { background: var(--chip-h); color: var(--fg); }

  .banner { margin: 0 12px 8px; padding: 6px 10px; border-radius: 8px; background: rgba(255,69,58,.14);
    font-size: 12px; display: none; }
  .banner.show { display: block; }
  .warn { margin: 0 12px 8px; padding: 6px 10px; border-radius: 8px; background: var(--chip); color: var(--fg2);
    font-size: 12px; display: none; }
  .warn.show { display: block; }
  .banner .btn { margin-left: 8px; padding: 2px 8px; font-size: 11.5px; vertical-align: 0; }
  .note { flex: none; background: var(--card); border-radius: 12px; padding: 10px 12px; animation: rise .18s ease-out;
    -webkit-user-select: text; cursor: auto; border: 1px solid var(--line); }
  .note .k { font-size: 11px; color: var(--fg3); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 3px; }
  .note .t { font-weight: 600; margin-bottom: 3px; }
  .note .s { color: var(--fg2); white-space: pre-wrap; }
  .note .row { display: flex; gap: 6px; margin-top: 8px; }
  .note .row .btn.primary { background: var(--accent); color: #fff; }
  .note.err .s { color: var(--rec); }
  .note.call { border-color: rgba(255,69,58,.35); }
  .note .s + .k { margin-top: 8px; }
  .note ul { margin: 6px 0 0; padding: 0; list-style: none; }
  .note li { color: var(--fg); padding: 2px 0 2px 18px; position: relative; }
  .note li::before { content: '☐'; position: absolute; left: 0; color: var(--fg3); }
  .note li .who { color: var(--fg3); }

  #answers { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 10px 12px 2px; overflow-y: auto;
    border-top: 1px solid var(--line); }
  #answers::-webkit-scrollbar { width: 6px; }
  #answers::-webkit-scrollbar-thumb { background: var(--chip-h); border-radius: 3px; }
  .empty { margin: auto; text-align: center; color: var(--fg3); padding: 18px 24px; }
  .empty b { display: block; color: var(--fg2); font-weight: 600; margin-bottom: 8px; }
  .ex { display: flex; flex-direction: column; gap: 6px; align-items: center; margin-top: 10px; }
  .ex button { border: 0; background: var(--chip); color: var(--fg2); font: inherit; font-size: 12px;
    padding: 5px 11px; border-radius: 999px; }
  .ex button:hover { background: var(--chip-h); color: var(--fg); }
  .qa { flex: none; background: var(--card); border-radius: 12px; padding: 9px 12px 10px; -webkit-user-select: text;
    cursor: auto; animation: rise .18s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .q { color: var(--fg2); font-size: 12px; font-weight: 500; margin-bottom: 4px; display: flex; gap: 6px; }
  .q .meta { margin-left: auto; color: var(--fg3); font-weight: 400; white-space: nowrap; }
  .a { white-space: pre-wrap; }
  .a.err { color: var(--rec); }
  .spin { display: inline-block; width: 11px; height: 11px; border: 2px solid var(--fg3); border-top-color: var(--fg);
    border-radius: 50%; animation: r .7s linear infinite; vertical-align: -1px; margin-right: 6px; }
  @keyframes r { to { transform: rotate(360deg); } }

  form { display: flex; align-items: center; gap: 6px; margin: 10px 12px 8px; padding: 4px 4px 4px 12px;
    background: var(--input); border-radius: 12px; border: 1px solid var(--line); }
  form:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(64,156,255,.18); }
  input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--fg); font: inherit;
    font-size: 13.5px; padding: 6px 0; -webkit-user-select: text; }
  input::placeholder { color: var(--fg3); }
  .mins { display: flex; background: var(--chip); border-radius: 8px; padding: 2px; }
  .mins button { border: 0; background: transparent; color: var(--fg2); font: inherit; font-size: 11.5px;
    padding: 3px 7px; border-radius: 6px; font-variant-numeric: tabular-nums; }
  .mins button.on { background: var(--chip-h); color: var(--fg); font-weight: 600; }

  footer { display: flex; align-items: center; gap: 6px; padding: 0 12px 12px; }
  .btn { border: 0; background: var(--chip); color: var(--fg); font: inherit; font-size: 12px; font-weight: 500;
    padding: 5px 10px; border-radius: 8px; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { background: var(--chip-h); }
  .btn:disabled { opacity: .4; }
  .btn i { width: 8px; height: 8px; background: var(--rec); display: inline-block; border-radius: 2px; }
  .btn.start i { border-radius: 50%; }
  .hint { margin-left: auto; color: var(--fg3); font-size: 11px; }
  kbd { font: inherit; padding: 0 4px; border-radius: 4px; background: var(--chip); color: var(--fg2); }
</style>
</head>
<body class="stopped">
  <header>
    <div class="dot"></div>
    <div class="title" id="state">Recorder</div>
    <div class="apps" id="apps"></div>
    <div class="clock" id="clock"></div>
    <button class="x" id="close" title="Hide (Esc)">✕</button>
  </header>
  <div class="banner" id="banner"></div>
  <div class="warn" id="warn"></div>
  <section id="answers"></section>
  <form id="ask" autocomplete="off">
    <input id="q" placeholder="Ask anything…" spellcheck="false">
    <div class="mins" id="mins">
      <button type="button" data-m="2">2m</button><button type="button" data-m="5" class="on">5m</button><button type="button" data-m="10">10m</button><button type="button" data-m="30">30m</button>
    </div>
  </form>
  <footer>
    <button class="btn" id="pause">Pause</button>
    <button class="btn" id="stop"><i></i>Stop</button>
    <button class="btn" id="notes" title="Save notes to your notes folder" disabled>Save notes</button>
    <span class="hint"><kbd>⌃⌥R</kbd> hide · <kbd>esc</kbd></span>
  </footer>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const post = (op, extra) => {
    try { window.webkit.messageHandlers.rec.postMessage(Object.assign({ op }, extra || {})); }
    catch (e) { console.log('no bridge', op); }
  };
  const box = $('answers');
  const EXAMPLES = ['What did I miss?', 'Quick recap', 'Any action items?'];
  let minutes = 5, state = 'stopped', startedAt = null, clockSkew = 0, nextId = 1;
  let sessionLines = 0, sessionMin = 0, saving = false, offered = false, lastSeen = Date.now();
  const pending = {}, history = [];   // history: last few {q, a} so follow-up questions work
  const HISTORY = 3, FORGET_MS = 10 * 60 * 1000;

  function scrollEnd() { box.scrollTop = box.scrollHeight; }
  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function button(label, cls, onclick) { const b = el('button', 'btn' + (cls ? ' ' + cls : ''), label); b.type = 'button'; b.onclick = onclick; return b; }

  function offerNotes() {
    if (offered || saving || sessionLines < 3 || sessionMin < 1) return;
    offered = true;
    const card = el('div', 'note');
    card.append(el('div', 'k', 'Stopped · ' + Math.round(sessionMin) + ' min'), el('div', 's', 'Want notes?'));
    const row = el('div', 'row');
    row.append(button('Save notes', 'primary', () => { card.remove(); saveNotes(); }),
               button('Skip', '', () => card.remove()));
    card.append(row); box.appendChild(card); showEmpty(); scrollEnd();
  }

  function saveNotes() {
    if (saving) return;
    saving = true; $('notes').disabled = true;
    const id = nextId++;
    const card = el('div', 'note');
    const s = el('div', 's'); s.innerHTML = '<span class="spin"></span>Writing your notes…';
    card.append(el('div', 'k', 'Notes'), s); box.appendChild(card); showEmpty(); scrollEnd();
    pending[id] = { notes: card };
    post('notes', { id });
  }

  function notesDone(card, r) {
    saving = false; card.textContent = '';
    if (r.error) { card.classList.add('err'); card.append(el('div', 'k', "Couldn't save notes"), el('div', 's', r.error)); }
    else {
      card.append(el('div', 'k', 'Notes saved'),
                  el('div', 't', r.title || 'Notes'), el('div', 's', r.summary || ''));
      const acts = r.action_items || [];
      if (acts.length) {
        const ul = el('ul');
        for (const a of acts.slice(0, 6)) {
          const li = el('li', '', a.task);
          const who = [a.owner, a.due].filter(Boolean).join(' · ');
          if (who) li.append(el('span', 'who', ' — ' + who));
          ul.append(li);
        }
        card.append(el('div', 'k', 'To-dos'), ul);
      }
      const row = el('div', 'row');
      row.append(button('Show in Finder', '', () => post('reveal', { path: r.path })));
      card.append(row);
      if (r.note) card.append(el('div', 's', r.note));
    }
    updateNotesButton(); scrollEnd();
  }

  function updateNotesButton() { $('notes').disabled = saving || sessionLines < 3; }

  const fmt = s => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = s % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
  const recording = () => state === 'running' || state === 'paused' || state === 'starting';

  function showEmpty() {
    const old = box.querySelector('.empty');
    if (box.querySelector('.qa, .note')) { if (old) old.remove(); return; }
    const kind = recording() ? 'rec' : 'off';
    if (old && old.dataset.kind === kind) return;
    if (old) old.remove();
    const e = document.createElement('div'); e.className = 'empty'; e.dataset.kind = kind;
    if (kind === 'rec') {
      e.innerHTML = '<b>Ask anything</b>';
      const ex = document.createElement('div'); ex.className = 'ex';
      for (const q of EXAMPLES) {
        const b = document.createElement('button'); b.type = 'button'; b.textContent = q;
        b.onclick = () => { $('q').value = q; $('ask').requestSubmit(); };
        ex.appendChild(b);
      }
      e.appendChild(ex);
    } else {
      e.innerHTML = '<b>Not recording</b>Hit Start, or ⌃⌥R in any app.';
    }
    box.appendChild(e);
  }

  function setState(f) {
    const was = state;
    state = f.state || 'stopped';
    if ('session_lines' in f) { sessionLines = f.session_lines || 0; sessionMin = f.session_minutes || 0; }
    if (state === 'running' && (was === 'stopped' || was === 'error')) { offered = false; history.length = 0; }
    document.body.className = state;
    $('state').textContent = f.not_listening ? 'Waiting for Hermes'
      : ({ running: 'Recording', paused: 'Paused', starting: 'Starting…', error: 'Error' }[state] || 'Stopped');
    if (f.apps) $('apps').textContent = f.apps.length ? '· ' + f.apps.join(', ') : '';
    if ('started_at' in f) startedAt = f.started_at || null;
    if (f.now) clockSkew = Date.now() / 1000 - f.now;
    const p = $('pause'), s = $('stop');
    p.disabled = !(state === 'running' || state === 'paused');
    p.textContent = state === 'paused' ? 'Resume' : 'Pause';
    const off = state === 'stopped' || state === 'error';
    s.className = off ? 'btn start' : 'btn';
    s.lastChild.textContent = off ? 'Start' : 'Stop';
    const b = $('banner');
    if (f.error) {
      b.textContent = f.error; b.classList.add('show');
      if (f.not_listening && f.can_open_hermes) b.append(button('Open Hermes', '', () => post('openHermes')));
    } else b.classList.remove('show');
    const h = $('warn'), w = (!f.error && f.warnings) || [];
    h.textContent = w.join(' '); h.classList.toggle('show', w.length > 0);
    tick();
    showEmpty();
    updateNotesButton();
    if ((was === 'running' || was === 'paused') && state === 'stopped') offerNotes();
  }

  function tick() {
    $('clock').textContent = (startedAt && recording()) ? fmt(Date.now() / 1000 - clockSkew - startedAt) : '';
  }
  setInterval(tick, 1000);

  $('mins').addEventListener('click', e => {
    const m = e.target.dataset && e.target.dataset.m; if (!m) return;
    minutes = +m;
    for (const b of $('mins').children) b.classList.toggle('on', b === e.target);
    $('q').placeholder = 'Ask anything · last ' + m + ' min';
    $('q').focus();
  });

  $('ask').addEventListener('submit', e => {
    e.preventDefault();
    const q = $('q').value.trim(); if (!q) return;
    const id = nextId++;
    const card = document.createElement('div'); card.className = 'qa';
    const qd = document.createElement('div'); qd.className = 'q';
    const qt = document.createElement('span'); qt.textContent = q;
    const meta = document.createElement('span'); meta.className = 'meta'; meta.textContent = 'last ' + minutes + 'm';
    qd.append(qt, meta);
    const a = document.createElement('div'); a.className = 'a'; a.innerHTML = '<span class="spin"></span>Thinking…';
    card.append(qd, a);
    box.appendChild(card);
    showEmpty();
    while (box.children.length > 20) box.firstElementChild.remove();
    box.scrollTop = box.scrollHeight;
    pending[id] = { a, meta, q };
    $('q').value = '';
    post('ask', { id, question: q, minutes, history: history.slice(-HISTORY) });
  });

  $('pause').onclick = () => post(state === 'paused' ? 'resume' : 'pause');
  $('stop').onclick = () => post(state === 'stopped' || state === 'error' ? 'start' : 'stop');
  $('close').onclick = () => post('hide');
  $('notes').onclick = saveNotes;
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { e.preventDefault(); post('hide'); } });

  function callCard(kind, info) {
    for (const old of box.querySelectorAll('.note.call')) old.remove();
    const card = el('div', 'note call'), row = el('div', 'row');
    if (kind === 'start') {
      card.append(el('div', 'k', info.app + ' call'), el('div', 's', 'Record it? Everything stays on your Mac.'));
      row.append(button('Record', 'primary', () => { card.remove(); post('recordCall', { bid: info.bid }); }),
                 button('Not now', '', () => card.remove()));
    } else {
      card.append(el('div', 'k', 'Call ended'), el('div', 's', 'Save notes from your ' + info.app + ' call?'));
      row.append(button('Save notes', 'primary', () => { card.remove(); offered = true; post('stop'); saveNotes(); }),
                 button('Keep recording', '', () => card.remove()));
    }
    card.append(row); box.appendChild(card); showEmpty(); scrollEnd();
  }

  window.rec = {
    status: setState,
    offerCall(info) { callCard('start', info); },
    callEnded(info) { callCard('end', info); },
    reply(id, r) {
      const p = pending[id]; if (!p) return; delete pending[id];
      if (p.notes) return notesDone(p.notes, r);
      if (r.error) { p.a.className = 'a err'; p.a.textContent = r.error; }
      else {
        p.a.textContent = r.answer; if (r.seconds) p.meta.textContent += ' · ' + r.seconds + 's';
        history.push({ q: p.q, a: r.answer }); while (history.length > HISTORY) history.shift();
      }
      lastSeen = Date.now();
      scrollEnd();
    },
    shown() {
      if (Date.now() - lastSeen > FORGET_MS) history.length = 0;  // a new conversation after a long break
      lastSeen = Date.now();
      $('q').focus();
    },
  };
  showEmpty();
  post('ready');
})();
</script>
</body>
</html>
